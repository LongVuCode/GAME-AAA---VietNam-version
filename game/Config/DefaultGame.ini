; DefaultGame.ini - ProjectFerry. NOT YET BUILT IN UNREAL ENGINE.

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=ProjectFerry
Description=Demo 0.1 graybox (internal codename, not a product name)

[/Script/UnrealEd.ProjectPackagingSettings]
; "Additional Non-Asset Directories to Package": design JSON read at runtime by UFerryDataSubsystem.
; Path is relative to Content/. Before packaging, copy <repo>/design/data/*.json into
; game/Content/Data/Design/ (see docs/BUILD_GUIDE_UE.md §8). The copy is git-ignored so the repo keeps
; a single source of truth (design/data).
+DirectoriesToAlwaysStageAsUFS=(Path="Data/Design")
; vi is the source language, en the second language (CLAUDE.md §1).
+CulturesToStage=vi
+CulturesToStage=en
; Realistic06 loads its custom rigs/clips by explicit paths; keep them when cooking this prototype.
+DirectoriesToAlwaysCook=(Path="/Game/Realistic06")
