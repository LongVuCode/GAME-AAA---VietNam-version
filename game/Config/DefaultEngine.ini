; DefaultEngine.ini - ProjectFerry (Demo 0.1 graybox). NOT YET BUILT IN UNREAL ENGINE.
; Minimal settings only; the editor will add its own keys when the PO saves Project Settings.

[/Script/EngineSettings.GameMapsSettings]
; The map is created by Content/Python/build_graybox_longbien.py. Until the script has been run the
; editor logs "map not found" once and opens an empty level (expected, see docs/BUILD_GUIDE_UE.md).
EditorStartupMap=/Game/Maps/L_LongBien_Graybox.L_LongBien_Graybox
GameDefaultMap=/Game/Maps/L_LongBien_Graybox.L_LongBien_Graybox
GlobalDefaultGameMode=/Script/ProjectFerry.FerryGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.RendererSettings]
; TECH_SPEC §5b (D-010, 8 GB VRAM): software Lumen is the default.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.Lumen.HardwareRayTracing=False

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Generates the "unreal" Python stub for IDE autocompletion (editor only, optional).
bDeveloperMode=True
